name: Manter Supabase ativo

# Risco §10 do pré-projeto: projeto gratuito pausa após 7 dias sem uso.
# Um ping duas vezes por semana via REST evita a pausa. Requer os secrets
# SUPABASE_URL e SUPABASE_ANON_KEY e a variável SUPABASE_PING_ATIVO=true.
on:
  schedule:
    - cron: "0 9 * * 1,4" # segunda e quinta, 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PING_ATIVO == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          # anon não lê tabelas (0004 revoga tudo): 401 também prova que a API e o banco responderam.
          codigo=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/estudantes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $codigo"
          case "$codigo" in
            200|401) echo "ping ok" ;;
            *) echo "::error::Supabase respondeu $codigo (pausado ou fora do ar?)"; exit 1 ;;
          esac
